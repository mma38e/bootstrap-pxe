user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Efficient large-file transfer (ISO images can be several GB)
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Long timeouts for slow imaging networks
    keepalive_timeout  300;
    send_timeout       600;

    log_format  main  '$remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    server {
        listen       80 default_server;
        server_name  _;

        root   /var/www/html;

        # Directory listing — installers (Anaconda, curtin) need to browse
        # the install tree. This server is internal to the imaging network.
        autoindex           on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # ── Ubuntu live server ISO ────────────────────────────────────────────
        location /ubuntu/ {
            alias /var/www/html/ubuntu/;
        }

        # ── Rocky Linux install tree ──────────────────────────────────────────
        location /rocky/ {
            alias /var/www/html/rocky/;
        }

        # ── Kickstart files ───────────────────────────────────────────────────
        # Anaconda requires Content-Type: text/plain for kickstart files.
        location /kickstart/ {
            alias /var/www/html/kickstart/;
            default_type text/plain;
        }

        # ── cloud-init / autoinstall ──────────────────────────────────────────
        # curtin requires user-data and meta-data served as text/plain.
        location /cloud-init/ {
            alias /var/www/html/cloud-init/;
            default_type text/plain;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Allow installer dotfiles (.treeinfo, .discinfo) that Anaconda needs
        location ~ /\.(treeinfo|discinfo)$ {
            default_type text/plain;
        }

        # Deny all other dotfiles (.env, .htpasswd, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
