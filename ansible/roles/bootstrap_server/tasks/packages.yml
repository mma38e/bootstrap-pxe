---
# packages.yml — Install host packages
#
# `baseline_packages` (in defaults/main.yml) is the SOURCE OF TRUTH for the
# package set this host must have. Every package the role needs is listed
# there, regardless of who actually puts the bits on disk first.
#
# In the standard airgap flow, bootstrap.sh pre-installs the EPEL set (htop,
# iotop, iperf3, minicom, screen, ntfs-3g, ntfsprogs, exfatprogs, dosfstools,
# fuse3) from the local-epel repo as a cold-boot optimization — but that
# pre-install is *not* a substitute for this task. dnf is idempotent:
# re-running here on a fully-installed host is a no-op. On an airgap host the
# full baseline resolves from local-baseos + local-appstream + local-epel
# (all registered by bootstrap.sh); standalone on a lab box it resolves from
# the online repos. No skip_broken here — an unavailable package means a
# repo-setup problem and must fail loudly, not be skipped silently.

- name: Install baseline packages (single transaction)
  ansible.builtin.dnf:
    name: "{{ baseline_packages }}"
    state: present
  when: install_baseline

- name: Install services packages (httpd, tftp-server)
  ansible.builtin.dnf:
    name: "{{ services_packages }}"
    state: present
  when: install_services

- name: Install k8s tools (kubectl)
  ansible.builtin.dnf:
    name: kubectl
    state: present
  when: install_k8s_tools
  # Requires kubernetes repo — add repo task if using online mode.
  # In airgap: place kubectl RPM in files/rpms/k8s/ and install via bootstrap.sh.

- name: Install helm
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}.tar.gz"
    mode: "0644"
  when: install_k8s_tools
  register: helm_download

- name: Extract and install helm
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}.tar.gz"
    dest: /tmp/
    remote_src: true
  when: install_k8s_tools and helm_download is changed

- name: Place helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true
  when: install_k8s_tools

- name: Install k9s
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: "/tmp/k9s-{{ k9s_version }}.tar.gz"
    mode: "0644"
  when: install_k8s_tools
  register: k9s_download

- name: Extract and install k9s
  ansible.builtin.unarchive:
    src: "/tmp/k9s-{{ k9s_version }}.tar.gz"
    dest: /usr/local/bin/
    include: [k9s]
    remote_src: true
    mode: "0755"
  when: install_k8s_tools and k9s_download is changed
