---
# docker.yml — Install Docker CE, start it, and add the admin user to its group.
#
# bootstrap.sh installs Docker first on an airgapped host, because ansible-runner
# needs it, so the install tasks are no-ops there. The role declares it anyway so
# it converges a host on its own, and so skipping pxe_server keeps Docker.

- name: Find local Docker RPMs
  ansible.builtin.find:
    paths: "{{ bootstrap_airgap_files_dir }}/rpms/docker"
    patterns: "*.rpm"
  register: docker_rpms
  when: airgap_mode | default(false) | bool

- name: Install Docker CE from local RPMs
  ansible.builtin.dnf:
    name: "{{ docker_rpms.files | map(attribute='path') | list }}"
    state: present
    disable_gpg_check: true
  when: airgap_mode | default(false) | bool

- name: Add the Docker CE repo
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
  when: not (airgap_mode | default(false) | bool)

- name: Install Docker CE from the repo
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present
  when: not (airgap_mode | default(false) | bool)

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: "{{ docker_service_state }}"

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

# Guarded so a tag-scoped run (--tags docker) can only modify an existing
# user: ansible.builtin.user would otherwise CREATE the admin user here as a
# locked, passwordless account, and users.yml's `update_password: on_create`
# would then never set its password. In the full play users.yml runs first.
- name: Check whether admin user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ bootstrap_admin_user }}"
    fail_key: false
  when: bootstrap_admin_user is defined and bootstrap_admin_user != 'root'

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    groups: docker
    append: true
  when:
    - bootstrap_admin_user is defined and bootstrap_admin_user != 'root'
    - getent_passwd[bootstrap_admin_user] is not none
