---
# users.yml — Create and configure the admin user
#
# MUST run before any other task that references the admin user with
# ansible.builtin.user (e.g. docker.yml group membership): that module
# creates a passwordless, locked user as a side effect if it doesn't exist
# yet, and `update_password: on_create` below then never sets the password.

- name: Ensure admin groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ bootstrap_admin_groups }}"
  when: bootstrap_admin_user is defined and bootstrap_admin_user != 'root'

- name: Create admin user
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    password: "{{ bootstrap_admin_password | password_hash('sha512') }}"
    update_password: on_create   # only set on first creation; preserves manual changes
    groups: "{{ bootstrap_admin_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    state: present
  when: bootstrap_admin_user is defined and bootstrap_admin_user != 'root'

- name: Ensure .ssh directory has correct permissions
  ansible.builtin.file:
    path: "/home/{{ bootstrap_admin_user }}/.ssh"
    state: directory
    owner: "{{ bootstrap_admin_user }}"
    group: "{{ bootstrap_admin_user }}"
    mode: "0700"
  when: bootstrap_admin_user is defined and bootstrap_admin_user != 'root'

- name: Add useful aliases and PATH to admin .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ bootstrap_admin_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK — bootstrap-server"
    block: |
      # Bootstrap server aliases
      alias ll='ls -lah --color=auto'
      alias d='docker'
      alias dps='docker ps'
      alias dpsa='docker ps -a'
      alias dc='docker compose'
      alias k='kubectl'

      # PATH additions
      export PATH="/usr/local/bin:${PATH}"
    create: true
  when: bootstrap_admin_user is defined and bootstrap_admin_user != 'root'

# Under the STIG the wheel group uses sudo with its password: RHEL-09-611085
# forbids NOPASSWD, and keeping the file would fight the STIG role on every run.
- name: Allow wheel group sudo without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/wheel-nopasswd
    line: "%wheel ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"
  when: not (install_stig | bool)

- name: Remove passwordless sudo for the wheel group under the STIG
  ansible.builtin.file:
    path: /etc/sudoers.d/wheel-nopasswd
    state: absent
  when: install_stig | bool

# ── Ansible service account ──────────────────────────────────────────────────
# bootstrap.sh creates this account before the first run, because Ansible logs
# in with it. Declared here too so the role converges a host on its own
# (AGENTS.md rule #11). No password: it only ever logs in with the key.
# Never expires: an account created after the STIG would otherwise inherit its
# 60-day password age, and Ansible would be locked out when it ran out.
- name: Create the Ansible service account
  ansible.builtin.user:
    name: "{{ bootstrap_ansible_user }}"
    shell: /bin/bash
    create_home: true
    password_expire_max: -1
    expires: -1
    state: present

- name: Authorize the Ansible controller key
  ansible.posix.authorized_key:
    user: "{{ bootstrap_ansible_user }}"
    key: "{{ lookup('ansible.builtin.file', bootstrap_ansible_pubkey_file) }}"
    state: present

# Passwordless sudo is a documented STIG exception: it is what lets Ansible run
# unattended. Only this account's line is managed, because the STIG adds its own
# Defaults lines to every sudoers file.
- name: Allow the Ansible service account sudo without a password
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ bootstrap_ansible_user }}"
    regexp: '^{{ bootstrap_ansible_user }}\s'
    line: "{{ bootstrap_ansible_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
