---
# services.yml — Enable and configure system services

- name: Enable and start httpd
  ansible.builtin.systemd:
    name: httpd
    enabled: true
    state: started
  when: httpd_enabled | bool
  notify: restart httpd

- name: Open firewall for httpd (port 80)
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when: httpd_enabled | bool
  ignore_errors: true  # firewalld may not be running in all environments

- name: Enable tftp socket
  ansible.builtin.systemd:
    name: tftp.socket
    enabled: true
    state: started
  when: tftp_enabled | bool

- name: Open firewall for tftp (port 69/udp)
  ansible.posix.firewalld:
    service: tftp
    permanent: true
    state: enabled
    immediate: true
  when: tftp_enabled | bool
  ignore_errors: true

- name: Ensure sshd is enabled
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started

- name: Enable cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  when: cockpit_enabled | bool

- name: Open firewall for cockpit (port 9090)
  ansible.posix.firewalld:
    service: cockpit
    permanent: true
    state: enabled
    immediate: true
  when: cockpit_enabled | bool
  ignore_errors: true
