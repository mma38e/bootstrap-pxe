---
# bootstrap_server role — Task orchestration
# Run specific stages with --tags, e.g.: --tags packages,docker

- name: Install packages
  import_tasks: packages.yml
  tags: [packages]

# users.yml must precede docker.yml and directories.yml: both reference the
# admin user, and ansible.builtin.user would otherwise create it as a locked,
# passwordless account before "Create admin user" (with update_password:
# on_create) gets a chance to set the password.
- name: Configure users
  import_tasks: users.yml
  tags: [users]

- name: Configure Docker
  import_tasks: docker.yml
  tags: [docker]

- name: Create directory structure
  import_tasks: directories.yml
  tags: [directories]

- name: Configure services
  import_tasks: services.yml
  tags: [services]

# Before the banner and xrdp, which both need GNOME on the host.
- name: Configure the desktop
  import_tasks: desktop.yml
  tags: [desktop]
  when: install_desktop | bool

- name: Configure the hypervisor
  import_tasks: hypervisor.yml
  tags: [hypervisor]
  when: install_hypervisor | bool

- name: Install guest agents
  import_tasks: guest_agents.yml
  tags: [guest_agents]
  when: install_guest_agents | bool

- name: Configure classification banner
  import_tasks: classification_banner.yml
  tags: [banner]
  when: install_classification_banner | bool

- name: Configure smart cards
  import_tasks: smartcard.yml
  tags: [smartcard]
  when: install_smartcard | bool

- name: Install DoD certificates
  import_tasks: dod_certs.yml
  tags: [dod_certs]
  when: install_dod_certs | bool

- name: Add DoD certificates to NSS databases
  import_tasks: nssdb.yml
  tags: [dod_certs]
  when: install_dod_certs | bool

- name: Install Google Chrome
  import_tasks: chrome.yml
  tags: [chrome]
  when: install_google_chrome | bool

- name: Install VS Code
  import_tasks: vscode.yml
  tags: [vscode]
  when: install_vscode | bool

- name: Configure xrdp
  import_tasks: xrdp.yml
  tags: [xrdp]
  when: install_xrdp | bool

- name: Deploy login info script
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/profile.d/bootstrap-motd.sh
    owner: root
    group: root
    mode: "0755"
  tags: [motd]

- name: Clear static /etc/motd
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
  tags: [motd]
