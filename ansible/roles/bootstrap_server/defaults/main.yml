---
# Bootstrap Server Role — Default Variables
# Override any of these in inventory.ini, group_vars, or via -e on the command line.

# ── Admin user ────────────────────────────────────────────────────────────────
bootstrap_admin_user: "cloud"
bootstrap_admin_password: "password"   # default — override in group_vars or vault
bootstrap_admin_groups:
  - docker
  - wheel

# ── Directories ───────────────────────────────────────────────────────────────
bootstrap_project_dir: "/opt/bootstrap"
bootstrap_data_dirs:
  - "{{ bootstrap_project_dir }}"
  - "{{ bootstrap_project_dir }}/data"
  - "{{ bootstrap_project_dir }}/scripts"
  - "{{ bootstrap_project_dir }}/logs"

# ── Tool installation toggles ─────────────────────────────────────────────────

install_baseline: true
# Installs the full baseline package set (see baseline_packages below).
# Set to false only for highly customized inventories — the role assumes baseline = on.

install_services: false
# httpd, tftp-server — disabled by default; handled by the pxe-server stack.

install_k8s_tools: false
# kubectl, helm, k9s — disabled by default; prefer running these in containers.
# Set to true only if you need native CLI tools on the host.

# ── Package lists ────────────────────────────────────────────────────────────
baseline_packages:
  # Base utilities
  - git
  - vim
  - curl
  - wget
  - jq
  - rsync
  - unzip
  - tar
  - bash-completion
  - sudo
  - python3-libselinux
  - tmux
  - zstd
  # Dev / build
  - python3
  - python3-pip
  - make
  - gcc
  - kernel-devel
  # Network
  - nmap
  - tcpdump
  - bind-utils
  - net-tools
  - iproute
  - socat
  - iperf3
  # Monitoring
  - htop
  - iotop
  - lsof
  - strace
  # Serial / terminal
  - minicom
  - screen
  # Filesystem (NTFS, exFAT, FAT32, ext4, XFS)
  - ntfs-3g
  - ntfsprogs
  - exfatprogs
  - dosfstools
  - e2fsprogs
  - xfsprogs
  - fuse3

services_packages:
  - httpd
  - tftp-server

# ── Classification banner ────────────────────────────────────────────────────
install_classification_banner: false
# When true: install gnome-shell-extension-classification-banner and apply the
# system-wide dconf settings for the chosen class_level. Settings are LOCKED
# so non-root users cannot disable or alter them.

class_level: "UNCLASSIFIED"
# Active classification level. Must be a key in classification_banners below.
# Override per-host in inventory/host_vars (this is security-relevant config).

classification_banners:
  UNCLASSIFIED:
    message: "UNCLASSIFIED"
    color: "rgba(255,255,255,1)"
    background-color: "rgba(0,122,51,1)"      # green
    top-banner: true
    bottom-banner: false
  CUI:
    message: "CUI"
    color: "rgba(255,255,255,1)"
    background-color: "rgba(80,43,133,1)"     # purple
    top-banner: true
    bottom-banner: true
  CONFIDENTIAL:
    message: "CONFIDENTIAL"
    color: "rgba(255,255,255,1)"
    background-color: "rgba(0,51,160,1)"      # blue
    top-banner: true
    bottom-banner: true
  SECRET:
    message: "SECRET"
    color: "rgba(255,255,255,1)"
    background-color: "rgba(200,16,46,1)"     # red
    top-banner: true
    bottom-banner: true
  TOP SECRET:
    message: "TOP SECRET"
    color: "rgba(0,0,0,1)"
    background-color: "rgba(255,140,0,1)"     # orange
    top-banner: true
    bottom-banner: true

# Canonical extension UUID shipped by Rocky/RHEL 9's
# gnome-shell-extension-classification-banner package.
# TODO: verify on a real Rocky 9 install with: ls /usr/share/gnome-shell/extensions/
classification_banner_uuid: "classification-banner@gnome-shell-extensions.gcampax.github.com"

# ── Desktop ──────────────────────────────────────────────────────────────────
install_desktop: true
# GNOME, GDM, and the graphical boot target. install_xrdp needs this.

desktop_packages:
  - gdm
  - gnome-shell
  - gnome-session-xsession
  - gnome-terminal
  - nautilus
  - brasero

# ── Hypervisor ───────────────────────────────────────────────────────────────
install_hypervisor: true
# KVM, libvirt, and the management tools.

hypervisor_packages:
  - qemu-kvm
  - libvirt
  - libvirt-client
  - libguestfs
  - virt-install
  - virt-manager
  - virt-viewer
  - virt-top
  - cockpit-machines

hypervisor_services:
  - virtqemud.socket
  - virtnetworkd.socket
  - virtstoraged.socket

# ── Guest agents ─────────────────────────────────────────────────────────────
install_guest_agents: false
# For a host that is itself a VM. Off here, on in group_vars/docker_vm.yml.

guest_agent_packages:
  - qemu-guest-agent
  - open-vm-tools

# ── Airgap artifacts ─────────────────────────────────────────────────────────
bootstrap_airgap_files_dir: "/root/bootstrap/files"
# Where bootstrap.ks stages files/ on the host. Read when airgap_mode is true.

# ── Smart cards ──────────────────────────────────────────────────────────────
install_smartcard: true
# Reader drivers + OpenSC, and the pcscd socket. Covers browser and app use of a
# CAC/PIV card, not smart card OS login.

smartcard_packages:
  - pcsc-lite
  - pcsc-lite-ccid
  - opensc

# ── DoD PKI ──────────────────────────────────────────────────────────────────
install_dod_certs: true
# Adds the DoD CA bundle to the system trust store and Chrome's NSS db.

dod_certs_zip: "unclass-certificates_pkcs7_DoD.zip"
dod_certs_url: "https://dl.dod.cyber.mil/wp-content/uploads/pki-pke/zip/{{ dod_certs_zip }}"
dod_certs_anchor: "/etc/pki/ca-trust/source/anchors/dod-ca-bundle.pem"

# ── Google Chrome ────────────────────────────────────────────────────────────
install_google_chrome: true
google_chrome_rpm_url: "https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm"
# Used only when airgap_mode is false.

# ── VS Code ──────────────────────────────────────────────────────────────────
install_vscode: true

vscode_extensions:
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.remote-explorer
  - ms-vscode-remote.remote-ssh
# Installed in this order for bootstrap_admin_user. Keep in sync with
# VSCODE_EXTENSIONS in build-iso.sh, which pins their versions for airgap.

vscode_extensions_dir: "{{ bootstrap_project_dir }}/data/vscode-extensions"

# ── xrdp ─────────────────────────────────────────────────────────────────────
install_xrdp: true
# RDP access from a Windows desktop. Opens 3389/tcp in firewalld, so firewalld
# must be running.

xrdp_packages:
  - xrdp
  - xorgxrdp
  - xrdp-selinux
# Keep in sync with XRDP_PKGS in build-iso.sh.

# ── Docker ────────────────────────────────────────────────────────────────────
# bootstrap.sh installs Docker first on an airgapped host, because ansible-runner
# needs it, so the role's install task is a no-op there.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

docker_service_state: started
docker_service_enabled: true

# ── Services ──────────────────────────────────────────────────────────────────
install_cockpit: true
# cockpit package, cockpit.socket, and firewall port 9090.

cockpit_enabled: "{{ install_cockpit }}"
httpd_enabled: "{{ install_services }}"
tftp_enabled: "{{ install_services }}"

# ── k8s tool versions (used only when install_k8s_tools: true) ───────────────
kubectl_version: "1.30.0"
helm_version: "3.15.0"
k9s_version: "0.32.5"
