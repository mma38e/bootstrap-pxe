---
# Install Docker CE and the Compose plugin on Debian/Ubuntu and RHEL/Rocky hosts.
# Skips installation entirely if Docker is already present (safe for air-gapped hosts).

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker CE
  when: docker_check.rc != 0
  block:
    # ── Debian / Ubuntu ──────────────────────────────────────────────────────
    - name: Install prerequisite packages (Debian)
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Create Docker keyring directory (Debian)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Download Docker GPG key (Debian)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == "Debian"

    - name: Add Docker apt repository (Debian)
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Install Docker CE (Debian)
      apt:
        name:
          - "docker-ce{{ (':' + docker_ce_version) if docker_ce_version else '' }}"
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    # ── RedHat / Rocky ─────────────────────────────────────────────────────
    - name: Install dnf-plugins-core (RedHat)
      dnf:
        name: dnf-plugins-core
        state: present
      when: ansible_os_family == "RedHat"

    - name: Add Docker CE repo (RedHat)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when: ansible_os_family == "RedHat"

    - name: Install Docker CE (RedHat)
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "RedHat"

# ── Common (always run) ───────────────────────────────────────────────────────
- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user is defined
